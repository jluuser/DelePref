[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delepref"
version = "1.0.0"
description = "Counterfactual deletion preference learning for protein miniaturization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
dependencies = [
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.1",
]

[project.optional-dependencies]
evaluation = [
  "biopython>=1.81",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "transformers>=4.40",
]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "scripts"]
testpaths = ["tests"]
