[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delepref"
version = "1.1.0"
description = "Homology-guided exact-budget protein shrinking with learned deletion planning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
dependencies = [
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.1",
]

[project.scripts]
delepref = "delepref.cli:main"

[project.optional-dependencies]
encoder = ["esm==3.2.1.post1", "transformers==4.45.0", "tokenizers==0.20.0"]
evaluation = [
  "biopython>=1.81",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "transformers>=4.40",
]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "scripts"]
testpaths = ["tests"]

[tool.setuptools.package-data]
delepref = ["assets/*.json", "assets/*.safetensors", "assets/*.md", "assets/examples/*/*"]
